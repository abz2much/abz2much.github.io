<!doctype html>
<html lang="en-GB">
<head>
<meta name="lite-version" content="5837645">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome</title>
<link rel="stylesheet" href="style.css?v=5837645">
</head>
<body>
<div class="scene" aria-hidden="true">
  <img src="photo.jpg?v=5837645" alt="">
  <div class="shade"></div>
</div>

<div class="dateline" id="dateline"></div>
<div class="clock" id="clock" aria-hidden="true"></div>

<div class="hello">
  <div class="eyebrow" id="place" hidden></div>
  <h1 id="title">Welcome</h1>
  <p id="stay" hidden></p>
</div>

<div class="cards">
  <div class="card glass" id="stay-card" hidden>
    <div class="label">Your stay</div>
    <div class="big" id="checkout"></div>
  </div>
  <div class="card glass wifi" id="wifi-card" hidden>
    <div class="qr" id="wifi-qr"></div>
    <div>
      <div class="label">Wi-Fi</div>
      <div class="big" id="wifi-name"></div>
      <div class="small">Scan with your camera to join</div>
    </div>
  </div>
  <div class="card glass" id="weather-card" hidden>
    <div class="label">Weather</div>
    <div class="temp" id="wx-now"></div>
    <div class="small" id="wx-more"></div>
  </div>
</div>

<div class="apps" id="apps" hidden></div>

<div class="rules-panel" id="rules-panel" hidden>
  <div class="rules-box glass">
    <div class="eyebrow" id="rules-place" hidden></div>
    <h2>House rules</h2>
    <div class="rules-scroll" id="rules-scroll"><ul id="rules-list"></ul></div>
    <div class="rules-hint" id="rules-hint">Press Back to close</div>
  </div>
</div>

<script src="config.js?v=5837645"></script>
<script src="screen.js?v=5837645"></script>
<script>start();</script>
</body>
</html>
